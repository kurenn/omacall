[package]
name = "omacall"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
bytes = "1.12.1"
futures-lite = "2.6.1"
iroh = { version = "1.2.0", features = ["qlog"] }
postcard = { version = "1.1.3", features = ["alloc"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["full"] }

[lib]
name = "omacall"
path = "src/lib.rs"
